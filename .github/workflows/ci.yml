name: CPU and distribution
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.17'
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cpu-${{ matrix.python }}
          path: test-results.xml
  distribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.17'
      - run: uv build
      - name: Check distribution contents
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile
          for path in glob.glob("dist/*.tar.gz"):
              with tarfile.open(path) as archive:
                  assert all("/.internal/" not in name for name in archive.getnames())
          for path in glob.glob("dist/*.whl"):
              with zipfile.ZipFile(path) as archive:
                  assert all(".internal/" not in name for name in archive.namelist())
                  assert any(name.endswith("/licenses/LICENSE") for name in archive.namelist())
          PY
      - run: uv venv /tmp/kinoweave-wheel --python 3.11
      - run: uv pip install --python /tmp/kinoweave-wheel/bin/python --no-index --no-deps dist/*.whl
      - name: Verify installed CLI outside the checkout
        working-directory: /tmp
        run: |
          /tmp/kinoweave-wheel/bin/python -I - <<'PY'
          import importlib.util
          import kinoweave
          from pathlib import Path
          from kinoweave.assets import load_visuals
          from kinoweave.visualization import ViserViewer
          from kinoweave.manipulation import SingleArmPlanner, MultiArmPlanner, validate_manipulation
          from kinoweave.manipulation import refine_manipulation, evaluate_objective
          from kinoweave.manipulation import SchedulePlanner, TaskDomain
          assert Path(kinoweave.__file__).is_relative_to(Path("/tmp/kinoweave-wheel"))
          assert callable(load_visuals) and callable(ViserViewer)
          assert callable(SingleArmPlanner) and callable(validate_manipulation)
          assert callable(MultiArmPlanner)
          assert callable(refine_manipulation) and callable(evaluate_objective)
          assert callable(SchedulePlanner) and callable(TaskDomain)
          for name in ("numpy", "torch", "curobo", "viser", "yourdfpy", "yaml"):
              assert importlib.util.find_spec(name) is None, name
          PY
          /tmp/kinoweave-wheel/bin/kinoweave example --output /tmp/arms.json > /dev/null
          /tmp/kinoweave-wheel/bin/kinoweave plan /tmp/arms.json --samples 0 --output /tmp/arms-run > /dev/null
          /tmp/kinoweave-wheel/bin/kinoweave validate /tmp/arms-run/problem.json /tmp/arms-run/result.json
          /tmp/kinoweave-wheel/bin/kinoweave playback /tmp/arms-run/problem.json /tmp/arms-run/result.json --output /tmp/playback.json > /dev/null
          /tmp/kinoweave-wheel/bin/python "$GITHUB_WORKSPACE/examples/single_arm_pick_place.py" --output /tmp/pick-place
          /tmp/kinoweave-wheel/bin/python "$GITHUB_WORKSPACE/examples/two_arm_handover.py" --refine --refinement-iterations 1 --refinement-seconds 30 --output /tmp/handover
          /tmp/kinoweave-wheel/bin/python "$GITHUB_WORKSPACE/examples/task_scheduling.py" --output /tmp/task-run
          /tmp/kinoweave-wheel/bin/python "$GITHUB_WORKSPACE/examples/many_arm_inspection.py" --robots 4 --tasks 4 --topology paired --output /tmp/many-tools
          /tmp/kinoweave-wheel/bin/python "$GITHUB_WORKSPACE/examples/eight_ur5.py" --output /tmp/eight-ur5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
  visualization:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.17'
      - run: uv sync --project environments/viz --locked
      - run: uv run --project environments/viz --no-sync playwright install --with-deps chromium
      - run: uv run --project environments/viz --no-sync python examples/fetch_ur5.py
      - run: uv run --project environments/viz --no-sync pytest tests -q --run-viz --junitxml=viz-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: visualization-validation
          path: viz-results.xml
