name: Qualified CUDA validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, linux, x64, kinoweave-cuda12]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.17'
      - run: nvidia-smi
      - run: uv sync --project environments/cuda12 --locked
      - run: uv run --project environments/cuda12 --no-sync python examples/fetch_ur5.py
      - run: uv run --project environments/cuda12 --no-sync pytest tests -q --run-cuda --run-assets --junitxml=gpu-results.xml
      - run: uv run --project environments/cuda12 --no-sync python examples/coordinated_planning.py --backend curobo --output gpu-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cuda-validation
          path: |
            gpu-results.xml
            gpu-smoke/
