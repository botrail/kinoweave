[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kinoweave"
version = "0.1.0.dev0"
description = "GPU-accelerated multi-robot planning with platform-independent trajectories"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
viz = ["viser==1.1.1"]
urdf = ["yourdfpy==0.0.60", "trimesh==5.2.0", "PyYAML>=6.0.2,<7", "defusedxml>=0.7,<1"]

[project.scripts]
kinoweave = "kinoweave.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kinoweave = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "cuda: requires the optional cuRobo stack and an accessible NVIDIA GPU",
    "viz: requires optional Viser and browser packages",
    "assets: requires optional URDF/YAML packages",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
